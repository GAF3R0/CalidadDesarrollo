server {
    listen 80;
    server_name localhost;

    # Servir los archivos estáticos del frontend (Vite build)
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: redirige /api al contenedor del backend
    location /api/ {
        proxy_pass http://backend:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy para servir uploads estáticos desde el backend
    location /uploads/ {
        proxy_pass http://backend:4001/uploads/;
        proxy_set_header Host $host;
    }

    # Caché para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
